[window]
opacity = 0.85
blur = true
padding = { x = 10, y = 10 }

[font]
size = 10.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

