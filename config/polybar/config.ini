[colors]
background = #121212
background-alt = #1a1a1a
foreground = #E0E0E0
primary = #61AFEF
secondary = #98C379
alert = #E06C75
disabled = #555555

[bar/sehbar]
width = 100%
height = 20pt
radius = 0

offset-x = 0%
offset-y = 0pt
top = true

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10;2"
font-1 = "fontello"

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

modules-left = xworkspaces xwindow
modules-center = media
modules-right = filesystem memory powerplan vpn wifi bluetooth pulseaudio battery xkeyboard date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
override-redirect = true

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:25:...%

[module/media]
type = custom/script
exec = playerctl metadata --format "{{ artist }} - {{ title }}" 2>/dev/null || echo ""
interval = 2
format = <label>
label = %output%
label-maxlen = 35
click-left = playerctl play-pause
click-right = playerctl next

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = %{F#61AFEF}%mountpoint%%{F-} %percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/powerplan]
type = custom/script
exec = powerprofilesctl get 2>/dev/null | sed 's/power-saver/S/;s/balanced/B/;s/performance/P/'
interval = 3
format-foreground = ${colors.primary}
click-left = sh -c 'p=$(powerprofilesctl get); if [ "$p" = "power-saver" ]; then powerprofilesctl set balanced; elif [ "$p" = "balanced" ]; then powerprofilesctl set performance; else powerprofilesctl set power-saver; fi'

[module/wifi]
type = custom/script
exec = iwgetid -r >/dev/null 2>&1 && echo "%{F#61AFEF}%{F-}" || echo "%{F#555555} %{F-}"
interval = 5
click-left = alacritty -e nmtui

[module/bluetooth]
type = custom/script
exec = command -v bluetoothctl >/dev/null 2>&1 && (bluetoothctl show | grep -q "Powered: yes" && echo "󰂯" || echo "%{F#555555}%{F-}") || echo "%{F#555555}%{F-}"
interval = 3
click-left = alacritty -e bluetuith

[module/vpn]
type = custom/script
exec = ip link 2>/dev/null | grep -q 'tun\|wg\|proton\|pvpn' && echo "VPN"
interval = 5
format-foreground = ${colors.primary}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume>  <label-volume> 
label-volume = %percentage%%
label-muted =  muted
label-muted-foreground = ${colors.disabled}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.primary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/battery]
type = internal/battery
full-at = 90
low-at = 20
battery = BAT1
adapter = ACAD
poll-interval = 5
label-charging = %{F#61AFEF}%{T1} %{T-}%percentage%%
label-discharging = %{F#61AFEF}%{T1} %{T-}%percentage%%
label-full = %{F#98C379}%{T1}%{T-} %percentage_raw%%
label-low = %{F#E06C75}%{T1}%{T-} %percentage%%

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.primary}
label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %H:%M
date-alt = %Y-%m-%d
label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true
